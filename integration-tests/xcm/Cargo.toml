[package]
name = "xcm-integration-tests"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.0.0" }
log = "0.4"

# Local crates
xcm-emulator = { path = "../../xcm/xcm-emulator" }
general-runtime = { path = "../../runtime/general" }

# Rootchain runtime (from thxnet-sdk)
thxnet-runtime = { git = "https://github.com/thxnet/thxnet-sdk", default-features = false, features = ["std"], branch = "experiment/1.1.0" }

# XCM
xcm = { package = "staging-xcm", git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
xcm-executor = { package = "staging-xcm-executor", git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
pallet-xcm = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
polkadot-parachain = { package = "polkadot-parachain-primitives", git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

# Cumulus
cumulus-primitives-core = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
parachains-common = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-pallet-xcmp-queue = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-pallet-dmp-queue = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-pallet-parachain-system = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
parachain-info = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

# Substrate
frame-support = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
frame-system = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-core = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-runtime = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-io = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-consensus-babe = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-consensus-grandpa = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-authority-discovery = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
pallet-im-online = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
pallet-balances = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
pallet-message-queue = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
pallet-staking = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

# Polkadot primitives
polkadot-primitives = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

# Required for test macros
sp-tracing = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

[dev-dependencies]
