# Zombienet configuration for local development
# This launches:
# - 1 Relay Chain (thxnet-local with 2 validators)
# - LeafchainA (Para ID 2000) with 2 collators (Alice, Bob)
# - LeafchainB (Para ID 2001) with 2 collators (Charlie, Dave)
#
# Usage:
#   export RELAY_BIN=/path/to/rootchain/target/release/polkadot
#   export COLLATOR_BIN=/path/to/leafchains/target/release/thxnet-leafchain
#   zombienet spawn scripts/zombienet-local.toml
#
# Prerequisites:
#   - Build rootchain binary (polkadot)
#   - Build leafchain binary (thxnet-leafchain)
#   - Install zombienet: npm install -g @zombienet/cli
#     or download from https://github.com/paritytech/zombienet/releases

[settings]
timeout = 1000

[relaychain]
chain = "thxnet-local"
default_command = "{{RELAY_BIN}}"
default_args = ["-lparachain=debug"]

  [[relaychain.nodes]]
  name = "alice"
  validator = true
  rpc_port = 9944
  p2p_port = 30333

  [[relaychain.nodes]]
  name = "bob"
  validator = true
  rpc_port = 9945
  p2p_port = 30334

[[parachains]]
id = 2000
chain = "leafchain-a-local"
cumulus_based = true

  [parachains.collator]
  name = "leafchain-a-collator-1"
  command = "{{COLLATOR_BIN}}"
  args = ["-lparachain=debug,xcm=trace"]
  rpc_port = 9946
  p2p_port = 31333

  [[parachains.collators]]
  name = "leafchain-a-collator-2"
  command = "{{COLLATOR_BIN}}"
  args = ["-lparachain=debug,xcm=trace"]
  rpc_port = 9947
  p2p_port = 31334

[[parachains]]
id = 2001
chain = "leafchain-b-local"
cumulus_based = true

  [parachains.collator]
  name = "leafchain-b-collator-1"
  command = "{{COLLATOR_BIN}}"
  args = ["-lparachain=debug,xcm=trace"]
  rpc_port = 9948
  p2p_port = 32333

  [[parachains.collators]]
  name = "leafchain-b-collator-2"
  command = "{{COLLATOR_BIN}}"
  args = ["-lparachain=debug,xcm=trace"]
  rpc_port = 9949
  p2p_port = 32334

# HRMP channels for cross-chain messaging
[[hrmp_channels]]
sender = 2000
recipient = 2001
max_capacity = 8
max_message_size = 512

[[hrmp_channels]]
sender = 2001
recipient = 2000
max_capacity = 8
max_message_size = 512
