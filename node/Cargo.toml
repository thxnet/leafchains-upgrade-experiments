[package]
name = "thxnet-leafchain"
build = "build.rs"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hex-literal = "0.3.4"
clap = { version = "4.1.8", features = ["derive"] }
tracing = "0.1"
codec = { package = "parity-scale-codec", version = "3.0.0" }
serde = { version = "1.0.152", features = ["derive"] }
jsonrpsee = { version = "0.16.2", features = ["server"] }

# Local
general-runtime = { path = "../runtime/general" }
pallet-assets = { git = "https://github.com/thxnet/thxnet-sdk", default-features = false, branch = "experiment/1.1.0" }
pallet-asset-tx-payment = { git = "https://github.com/thxnet/thxnet-sdk", default-features = false, branch = "experiment/1.1.0" }

# Substrate
frame-benchmarking = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
frame-benchmarking-cli = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
pallet-transaction-payment-rpc = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-basic-authorship = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-chain-spec = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-cli = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-client-api = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-consensus = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-executor = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-network = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-network-sync = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-rpc = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-service = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-sysinfo = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-telemetry = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-tracing = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-transaction-pool = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sc-transaction-pool-api = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-api = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-block-builder = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-blockchain = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-consensus-aura = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-core = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-io = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-keystore = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-runtime = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
sp-timestamp = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
substrate-frame-rpc-system = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
substrate-prometheus-endpoint = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
try-runtime-cli = { git = "https://github.com/thxnet/thxnet-sdk", optional = true, branch = "experiment/1.1.0" }

# Polkadot
polkadot-cli = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
polkadot-primitives = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
xcm = { package = "staging-xcm", git = "https://github.com/thxnet/thxnet-sdk", default-features = false, branch = "experiment/1.1.0" }

# Cumulus
cumulus-client-cli = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-client-consensus-aura = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-client-consensus-common = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-client-service = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-primitives-core = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-primitives-parachain-inherent = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }
cumulus-relay-chain-interface = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

[build-dependencies]
substrate-build-script-utils = { git = "https://github.com/thxnet/thxnet-sdk", branch = "experiment/1.1.0" }

[features]
default = []
runtime-benchmarks = [
    "try-runtime-cli/try-runtime",
    "general-runtime/runtime-benchmarks",
    "polkadot-cli/runtime-benchmarks",
]
try-runtime = [
    "try-runtime-cli/try-runtime",
    "general-runtime/try-runtime"
]
